name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue publications rather than cancelling a deployment already in progress.
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        run: |
          npm ci --prefix frontend
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Build static analyzers and run parser/model/packaging tests
        run: npm run build:pages --prefix frontend
      - name: Exercise strict static hosting on desktop and laptop
        run: npm run test:pages:ui --prefix frontend
      - name: Recheck publication payload after browser tests
        run: node scripts/build-pages.mjs --check
      - name: Upload Pages artifact for a manual main publication
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-browser-failures
          path: .run/pages-browser-results/
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
