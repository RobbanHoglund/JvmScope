name: VS Code extension checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extensions/vscode/package-lock.json
      - name: Resolve package filename from the extension manifest
        run: node scripts/vscode-package-path.cjs
      - name: Install build and test dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix extensions/vscode
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Build shared analyzers for VS Code
        run: npm run build --prefix extensions/vscode
      - name: Extension protocol and packaged-asset tests
        run: npm test --prefix extensions/vscode
      - name: Package installable VSIX
        run: npm run package --prefix extensions/vscode
      - name: Validate the actual Marketplace package
        run: python3 extensions/vscode/test/package.py
      - name: Extract the validated VSIX for browser tests
        run: python3 -m zipfile -e "$VSCODE_VSIX" .run/vscode-package
      - name: Packaged webview CSP and browser integration
        env:
          VSCODE_TEST_EXTENSION_ROOT: .run/vscode-package/extension
        run: npx --prefix frontend playwright test --config extensions/vscode/test/playwright.config.mjs
      - name: Install VSIX and test the minimum VS Code version
        run: xvfb-run -a npm run test:integration --prefix extensions/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: jvmscope-vscode
          path: build/vscode/*.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vscode-test-failures
          path: |
            .run/vscode-browser/
            .run/vscode-test/user-data/logs/
          retention-days: 7

  installed-package:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            vscode: '1.110.0'
          - os: macos-latest
            vscode: '1.110.0'
          - os: ubuntu-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Resolve package filename from the extension manifest
        run: node scripts/vscode-package-path.cjs
      - run: npm ci --prefix extensions/vscode
      - uses: actions/download-artifact@v4
        with:
          name: jvmscope-vscode
          path: build/vscode
      - name: Install and exercise the same VSIX on each desktop platform
        shell: bash
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:integration --prefix extensions/vscode
          else
            npm run test:integration --prefix extensions/vscode
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vscode-installed-failures-${{ matrix.os }}-${{ matrix.vscode }}
          path: .run/vscode-test/user-data/logs/
          retention-days: 7
