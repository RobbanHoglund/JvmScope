name: Analyzer release checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyzer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install frontend dependencies and Chromium
        run: |
          npm ci --prefix frontend
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Frontend build and parser/model/launcher unit tests
        run: npm run build --prefix frontend
      - name: Frontend browser regressions
        run: |
          cd frontend
          npx --no-install playwright test --config test/tls/playwright.config.js
      - name: Application package and real HTTP server checks
        run: bash ./scripts/gradlew build -x npmInstall --no-daemon --console=plain
      - name: Verify portable package licensing
        run: node scripts/project-legal.mjs --check-package slim/build/package
      - name: Slim browser regressions
        run: npm run test:slim:ui --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: analyzer-browser-failures
          path: |
            .run/tls-ui/
            .run/slim-browser-results/
          retention-days: 7

  container-ga:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        run: |
          npm ci --prefix frontend
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Build the actual Linux delivery image
        run: docker build -t jvmscope-slim:ga .
      - name: Verify constrained container, both analyzers and SIGTERM
        run: node scripts/slim/container-ga.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constrained-container-evidence
          path: |
            .run/container-ga/*.json
            .run/container-ga/*.log
            .run/slim-browser-results/
          retention-days: 7
