name: Feature suggestion
description: Suggest an improvement for the maintainer to consider.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome. The maintainer handles implementation and release decisions; there is no promised delivery date.
        External code and documentation contributions are not accepted. Do not include private or production data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to investigate, and what is difficult with the current tool?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Describe the improvement you would like and how it helps your use case.
    validations:
      required: true
